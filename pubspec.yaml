name: tictac
description: "A new Flutter project."
# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  audioplayers: ^6.1.0
  flutter:
    sdk: flutter
  flutter_screenutil: ^5.9.3
  go_router: ^14.6.3
  google_fonts: ^6.2.1
  ionicons: ^0.2.2
  lottie: ^3.3.1
  provider: ^6.1.2
  shared_preferences: ^2.3.5

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true

  assets:
    # Add assets from the images directory to the application.
    - assets/images/
    - assets/animations/
    - assets/sounds/
